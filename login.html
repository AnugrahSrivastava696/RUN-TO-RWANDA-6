<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061638">
  <title>RUN TO RWANDA 6 | Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-title">RUN TO RWANDA 6</header>

  <main class="login-panel">
    <h1>Login</h1>

    <form id="login-form" method="POST" action="/login" autocomplete="on">
      <input
        id="username"
        name="username"
        type="text"
        placeholder="Username"
        autocomplete="username"
        aria-label="Username"
        required
      >

      <input
        id="password"
        name="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        aria-label="Password"
        required
      >

      <button type="submit">LOGIN</button>
    </form>

    <a class="signup-link" href="signup.html">Signup</a>
  </main>
  </body>
  </html>
